<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSA Tracker — Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="icon">💊</div>
    <h1>HSA Tracker</h1>
    <p class="subtitle">Track your medical expenses,<br>upload receipts &amp; manage reimbursements.</p>

    <button class="google-btn" id="loginBtn" disabled>
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.998 23.998 0 0 0 0 24c0 3.77.9 7.34 2.44 10.5l8.09-5.91z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>

    <div class="login-error" id="loginError"></div>
    <p class="footer-note">Only authorized accounts can access this app.<br>Contact the administrator for access.</p>
  </div>

  <script src="config.js"></script>
  <script>
    let tokenClient;

    function initGoogleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.GOOGLE_CLIENT_ID,
        scope: CONFIG.SCOPES,
        callback: handleTokenResponse,
      });
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').addEventListener('click', () => {
        tokenClient.requestAccessToken();
      });
    }

    async function handleTokenResponse(response) {
      if (response.error) {
        showError('Authentication failed. Please try again.');
        return;
      }

      try {
        // Verify user email
        const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: 'Bearer ' + response.access_token },
        });
        const info = await res.json();

        if (!CONFIG.ALLOWED_EMAILS.includes(info.email.toLowerCase())) {
          showError('Access denied. ' + info.email + ' is not authorized.');
          google.accounts.oauth2.revoke(response.access_token);
          return;
        }

        // Store session
        sessionStorage.setItem('hsa_access_token', response.access_token);
        sessionStorage.setItem('hsa_user_email', info.email);
        sessionStorage.setItem('hsa_user_name', info.name || info.email);
        sessionStorage.setItem('hsa_user_picture', info.picture || '');

        window.location.href = 'app.html';
      } catch (err) {
        showError('Something went wrong. Please try again.');
      }
    }

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.add('show');
    }

    // If already logged in, go to app
    if (sessionStorage.getItem('hsa_access_token')) {
      window.location.href = 'app.html';
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" onload="initGoogleAuth()"></script>
</body>
</html>
